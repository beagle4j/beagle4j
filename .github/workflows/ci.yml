name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: JDK ${{ matrix.java }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 17 is the compile baseline and 21 the current LTS, so both are load-bearing.
        java: ['17', '21']
        os: [ubuntu-latest]
        include:
          # The console reporter chooses its glyphs from the output encoding, and Windows
          # is the platform where that decision is not a no-op. Worth one job to keep
          # honest.
          - java: '21'
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.os }}-jdk${{ matrix.java }}
          path: '**/target/surefire-reports/**'
          retention-days: 7
